services:
  - type: web
    name: yuva-factory-backend
    env: python
    plan: free
    buildCommand: "cd yuva-factory-BE && pip install -r requirements.txt"
    startCommand: "cd yuva-factory-BE && gunicorn run:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_ACFnINkr5Pp3@ep-wild-glitter-aywlgq5k-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: yuva-factory-frontend
    env: node
    plan: free
    buildCommand: "cd yuva-factory-FE && npm install && npm run build"
    startCommand: "cd yuva-factory-FE && npx serve -s build -l tcp://0.0.0.0:$PORT"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: yuva-factory-backend
          envVarKey: RENDER_EXTERNAL_URL
